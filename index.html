<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My First Web Page</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Hello, Web!</h1>
      <p>This is my first HTML page for this course.</p>
    </header>

    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>

    <main>
      <h2>About This Page</h2>
      <ul>
        <li>Item one</li>
        <li>Item two</li>
        <li>Item three</li>

      <a href="https://www.youtube.com/shorts/LADXkBN6jn0">
        IOS development roadmap
      </a>
      <img src="./ios.png" alt="IOS roadmap" />

      <table>
        <caption>
          My Course Schedule
        </caption>
        <thead>
          <tr>
            <th>Week</th>
            <th>Topic</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>4</td>
            <td>Advanced HTML</td>

      <form>
        <label for="name">Name</label>

        <input type="email" id="email" name="email" required />

        <label for="msg">Message</label>
        <textarea id="msg" name="msg"></textarea>

        <label for="referral">How did you find this page?</label>
        <select id="referral" name="referral">
          <option value="search">Search engine</option>
          <option value="social">Social media</option>
          <option value="friend">A friend</option>
        </select>

        <button type="submit">Send</button>
      </form>
    </main>

    <footer>
